services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Match to your host driver if 12.4 wheels misbehave (e.g. cu121).
        TORCH_CUDA_CHANNEL: cu124
        COMFYUI_REF: master
    image: comfyui:latest
    container_name: comfyui
    # CUDA PyTorch wheels are x86_64-only. Force amd64 so the image is correct
    # for NVIDIA hosts even when built on an arm64 machine (e.g. Apple Silicon,
    # where it builds under emulation and cannot use a GPU locally).
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      # Persist everything worth keeping outside the image.
      - ./data/models:/opt/ComfyUI/models
      - ./data/output:/opt/ComfyUI/output
      - ./data/input:/opt/ComfyUI/input
      - ./data/user:/opt/ComfyUI/user
      - ./data/custom_nodes:/opt/ComfyUI/custom_nodes
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Append extra ComfyUI flags here, e.g. "--lowvram --preview-method auto"
      COMFYUI_EXTRA_ARGS: ""
    # Default CUDA/NVIDIA GPU reservation (needs nvidia-container-toolkit on host).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
